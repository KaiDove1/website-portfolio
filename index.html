<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kai Dove is an AI and machine learning engineer and University of Virginia computer science graduate who builds production ML systems and scalable web applications."
    />
    <title>Kai Dove | AI &amp; Machine Learning Engineer</title>

    <!-- Apply the saved theme and font before first paint so there is no flash. Mirrors ThemeContext. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme, font;
        try { theme = localStorage.getItem('portfolio-theme'); font = localStorage.getItem('portfolio-font'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (font !== 'sans' && font !== 'mono') font = 'sans';
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-font', font);
      })();
    </script>

    <!-- Inter for the default face, JetBrains Mono for Monospaced mode -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=JetBrains+Mono:wght@200;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
